configuration:
  mqtt_host:
    name: Host do broker MQTT
    description: Endereço (hostname ou IP) do broker MQTT, ex.: core-mosquitto
  mqtt_port:
    name: Porta do broker MQTT
    description: Porta TCP do broker MQTT
  mqtt_user:
    name: Usuário MQTT
    description: Deixe vazio se o broker não usa autenticação
  mqtt_password:
    name: Senha MQTT
    description: Senha do usuário MQTT
  mqtt_topic:
    name: Tópico MQTT de saída
    description: Tópico onde as mensagens recebidas do WhatsApp são publicadas
  hook_events:
    name: Evento do WAHA
    description: Evento do WAHA que dispara a publicação no MQTT (message = só recebidas)
  api_key:
    name: Chave de API do WAHA
    description: Exige X-Api-Key em toda chamada à API/dashboard. Vazio = sem chave (rede local)
  engine:
    name: Engine do WhatsApp
    description: WEBJS usa o WhatsApp Web (recomendado)
  base_url:
    name: URL base do WAHA
    description: "Endereço público deste add-on, ex.: http://10.0.0.5:3000 - vazio = padrão"

network:
  3000/tcp: Dashboard WAHA (QR Code) - não usado no Ingress
