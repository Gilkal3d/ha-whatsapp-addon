configuration:
  mqtt_host:
    name: Host do broker MQTT
    description: Endereço (hostname ou IP) do broker MQTT, ex.: core-mosquitto
  mqtt_port:
    name: Porta do broker MQTT
    description: Porta TCP do broker MQTT
  mqtt_user:
    name: Usuário MQTT
    description: Deixe vazio se o broker não usa autenticação
  mqtt_password:
    name: Senha MQTT
    description: Senha do usuário MQTT
  mqtt_topic:
    name: Tópico MQTT de saída
    description: Tópico onde as mensagens recebidas do WhatsApp são publicadas
  hook_events:
    name: Evento do WAHA
    description: Evento do WAHA que dispara a publicação no MQTT (message = só recebidas)
  api_key:
    name: Chave de API do WAHA
    description: "Deixe vazio (recomendado na rede local) pra o painel conectar sem chave. Preencha pra exigir X-Api-Key em toda chamada à API"
  dashboard_user:
    name: Usuário do painel
    description: Usuário do dashboard e do Swagger do WAHA
  dashboard_password:
    name: Senha do painel
    description: Deixe vazio para rodar o painel sem tela de login
  engine:
    name: Engine do WhatsApp
    description: WEBJS usa o WhatsApp Web (recomendado)
  base_url:
    name: URL base do WAHA
    description: "Endereço público deste add-on, ex.: http://10.207.100.79:3000 - corrige o painel apontando pra 127.0.0.1. Vazio = padrão"

network:
  3000/tcp: Dashboard WAHA (QR Code) - não usado no Ingress
