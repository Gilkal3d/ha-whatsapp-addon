configuration:
  mqtt_host:
    name: Broker MQTT host
    description: Hostname or IP of the MQTT broker (e.g. core-mosquitto)
  mqtt_port:
    name: Broker MQTT port
    description: TCP port of the MQTT broker
  mqtt_user:
    name: MQTT username
    description: Leave empty if the broker has no authentication
  mqtt_password:
    name: MQTT password
    description: Password for the MQTT user
  mqtt_topic:
    name: MQTT output topic
    description: Topic where incoming WhatsApp messages are published
  hook_events:
    name: WAHA hook event
    description: WAHA event that triggers publishing to MQTT (message = incoming only)
  api_key:
    name: WAHA API key
    description: "Leave empty (recommended on LAN) so the dashboard connects without a key. Set a value to require X-Api-Key on every API call"
  dashboard_user:
    name: Dashboard username
    description: Username for the WAHA dashboard and Swagger
  dashboard_password:
    name: Dashboard password
    description: Leave empty to run the dashboard without a login prompt
  engine:
    name: WhatsApp engine
    description: WEBJS uses WhatsApp Web (recommended)
  base_url:
    name: WAHA base URL
    description: "Public address of this add-on, e.g. http://10.207.100.79:3000 - fixes the dashboard pointing to 127.0.0.1. Leave empty for default"
  pulse_seconds:
    name: Pulse duration (seconds)
    description: How long the WhatsApp Pulse switch stays ON after a message from the filtered contact arrives

network:
  3000/tcp: WAHA Dashboard (QR Code) - not used for Ingress
