name: Build add-on

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lê a versão do add-on
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' waha_mqtt/config.yaml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Uma única build multi-platform = manifesto multi-arch (amd64 + arm64)
      # em vez de duas builds disputando a mesma tag.
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./waha_mqtt
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/gilkal3d/waha_mqtt:latest
            ghcr.io/gilkal3d/waha_mqtt:${{ steps.version.outputs.version }}
